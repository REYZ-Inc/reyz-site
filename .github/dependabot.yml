# 依存の更新を機械に任せる（docs/STANDARDS.md「供給網」）。Actions は SHA 固定なので更新は PR 経由でしか入らない。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Tokyo }
    commit-message: { prefix: "chore(actions)" }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly, time: "09:00", timezone: Asia/Tokyo }
    commit-message: { prefix: "chore(npm)" }
    groups:
      npm: { patterns: ["*"] }
    open-pull-requests-limit: 3
