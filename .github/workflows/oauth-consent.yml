# 送信専用ユーザー（no-reply@）の OAuth 同意を、人の転記なしで反映する（ADR-0008、docs/contact-pipeline.md）。
#
# 人がやること: https://reyz.inc/oauth/callback.html → 「同意を開始する」→ no-reply@ でログインして許可 → 表示された同意コードをコピー
#              → この workflow を Run workflow（入力 code に貼る）。それだけ。
# workflow がやること: コード → トークン交換 → ID トークンで「同意した口座 = 送信専用ユーザー」を検証（違えば新トークンを失効させて失敗）
#              → GitHub Secret GMAIL_OAUTH_REFRESH_TOKEN を更新（GitHub App の権限）→ contact-worker を起動し配備完了を待つ
#              → 古いリフレッシュトークンを失効 → 運用記録の issue にコメント → Summary。トークンの値はどこにも表示しない。
# 前提（1 回）: GitHub App（vars.OPS_APP_ID / secrets.OPS_APP_PRIVATE_KEY。権限: Secrets 書き込み・Actions 書き込み・Issues 書き込み）、
#              vars.MAIL_SENDER_USER（no-reply@reyz.inc）、OAuth クライアントのリダイレクト URI に https://reyz.inc/oauth/callback.html。
#              手順: workers/contact/README.md
name: oauth-consent
on:
  workflow_dispatch:
    inputs:
      code:
        description: 受け取りページに表示された同意コード（1 回限り・数分で失効）
        required: true
permissions:
  contents: read
concurrency:
  group: oauth-consent
  cancel-in-progress: false
jobs:
  consent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 前提の確認（App・送信専用ユーザーの設定があるか）
        env:
          OPS_APP_ID: ${{ vars.OPS_APP_ID }}
          HAS_KEY: ${{ secrets.OPS_APP_PRIVATE_KEY != '' }}
          MAIL_SENDER_USER: ${{ vars.MAIL_SENDER_USER }}
          HAS_CLIENT: ${{ secrets.GMAIL_OAUTH_CLIENT_ID != '' && secrets.GMAIL_OAUTH_CLIENT_SECRET != '' }}
        run: |
          missing=""
          [ -n "$OPS_APP_ID" ] || missing="$missing vars.OPS_APP_ID"
          [ "$HAS_KEY" = "true" ] || missing="$missing secrets.OPS_APP_PRIVATE_KEY"
          [ -n "$MAIL_SENDER_USER" ] || missing="$missing vars.MAIL_SENDER_USER"
          [ "$HAS_CLIENT" = "true" ] || missing="$missing secrets.GMAIL_OAUTH_CLIENT_ID/GMAIL_OAUTH_CLIENT_SECRET"
          if [ -n "$missing" ]; then echo "::error title=oauth-consent::未設定:$missing（workers/contact/README.md の「同意の自動化の前提」）"; exit 1; fi
      - name: GitHub App のトークンを取得（Secret 更新・配備起動・記録のため）
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPS_APP_ID }}
          private-key: ${{ secrets.OPS_APP_PRIVATE_KEY }}
      - name: 現在のリフレッシュトークンを退避（後で失効させる。値は表示しない）
        env:
          OLD: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
        run: |
          umask 077; printf '%s' "$OLD" > /tmp/old.rt
      - name: コードをトークンに交換し、同意した口座を検証
        env:
          CODE: ${{ inputs.code }}
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          MAIL_SENDER_USER: ${{ vars.MAIL_SENDER_USER }}
          OAUTH_REDIRECT_URI: ${{ vars.OAUTH_REDIRECT_URI || 'https://reyz.inc/oauth/callback.html' }}
          OUT_FILE: /tmp/new.rt
          RESULT_JSON: /tmp/exchange.json
        run: |
          umask 077
          node infra/oauth/consent.mjs exchange
      - name: GitHub Secret GMAIL_OAUTH_REFRESH_TOKEN を更新
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh secret set GMAIL_OAUTH_REFRESH_TOKEN --repo "$REPO" < /tmp/new.rt
          echo "secret updated: GMAIL_OAUTH_REFRESH_TOKEN"
      - name: contact-worker を起動して配備完了を待つ（Worker secret が同期される）
        id: deploy
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          before=$(date -u +%s)
          gh workflow run contact-worker.yml --repo "$REPO" --ref main
          sleep 20
          run_id=""; conclusion=""
          for i in $(seq 1 40); do
            row=$(gh run list --repo "$REPO" --workflow contact-worker.yml --event workflow_dispatch --branch main --limit 1 --json databaseId,status,conclusion,createdAt -q '.[0] | "\(.databaseId) \(.status) \(.conclusion) \(.createdAt)"')
            set -- $row; id=$1; status=$2; concl=$3; created=$4
            if [ -n "$created" ] && [ "$(date -u -d "$created" +%s)" -ge "$before" ]; then
              run_id=$id; conclusion=$concl
              echo "try $i: run $id $status $concl"
              [ "$status" = "completed" ] && break
            else
              echo "try $i: waiting for the dispatched run to appear"
            fi
            sleep 15
          done
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"; echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          if [ "$conclusion" != "success" ]; then
            echo "::error title=oauth-consent::配備（contact-worker run $run_id）が success になりませんでした（$conclusion）。新しい Secret は登録済み。古いトークンは失効させていません"
            exit 1
          fi
      - name: 古いリフレッシュトークンを失効（新しいものと同じならスキップ）
        env:
          TOKEN_FILE: /tmp/old.rt
          NEW_TOKEN_FILE: /tmp/new.rt
        run: node infra/oauth/consent.mjs revoke
      - name: 後始末（トークンの一時ファイルを削除）
        if: always()
        run: shred -u /tmp/old.rt /tmp/new.rt 2>/dev/null || rm -f /tmp/old.rt /tmp/new.rt
      - name: 運用記録（issue「運用記録 — 認証情報」にコメント。トークンは書かない）
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_RUN: ${{ steps.deploy.outputs.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "App トークンなし（前提未設定）。記録は run の Summary のみ"; exit 0; }
          title="運用記録 — 認証情報（送信専用ユーザーの OAuth）"
          num=$(gh issue list --repo "$REPO" --state all --search "\"$title\" in:title" --json number,title -q ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -z "$num" ]; then
            num=$(gh issue create --repo "$REPO" --title "$title" --body "送信専用ユーザー（no-reply@）の OAuth 同意の更新記録。workflow oauth-consent が 1 回ごとにコメントを追加する。設計: docs/contact-pipeline.md、決定: docs/adr/0008-oauth-consent-automation.md。トークンの値は記録しない。" | grep -oE '[0-9]+$')
          fi
          detail=$(python3 -c "import json;d=json.load(open('/tmp/exchange.json'));print(('同意した口座: '+d.get('email','-')) if d.get('ok') else ('拒否: '+d.get('reason','-')))" 2>/dev/null || echo '交換の結果なし')
          body="$(date -u '+%Y-%m-%d %H:%M UTC') / 結果: **${RESULT}** / ${detail} / 実行者: @${ACTOR} / run: ${RUN_URL} / 配備 run: ${DEPLOY_RUN:--}"
          gh issue comment "$num" --repo "$REPO" --body "$body"
          echo "recorded in issue #$num"
      - name: Summary
        if: always()
        env:
          RESULT: ${{ job.status }}
          DEPLOY_RUN: ${{ steps.deploy.outputs.run_id }}
        run: |
          {
            echo "## oauth-consent: ${RESULT}"
            echo
            echo "- 同意の検証: $(python3 -c "import json;d=json.load(open('/tmp/exchange.json'));print((d.get('email','-')+' / '+d.get('scope','-')) if d.get('ok') else ('拒否: '+d.get('reason','-')))" 2>/dev/null || echo '（結果なし。上のエラーを参照）')"
            echo "- 配備（contact-worker）: ${DEPLOY_RUN:+run $DEPLOY_RUN}${DEPLOY_RUN:-未起動}"
            echo "- 次に人がやること: なし（フォームから 1 件テスト送信して受信トレイを見ると確実）"
          } >> "$GITHUB_STEP_SUMMARY"
