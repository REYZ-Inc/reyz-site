# 毎日 1 回、問い合わせ Worker の記録を集計し、異常（エラー応答・未検証の急増）だけを noc@ へ通知する（平常時は送らない）。
# 送信の認証（no-reply@ の OAuth）の失効は、Worker のエラー応答 `send/token` としてここで検知される。
# 記録の一覧は Actions → contact-logs。設計: docs/contact-pipeline.md
name: contact-watch
on:
  schedule:
    - cron: "37 0 * * *"   # 09:37 JST
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - name: 直近 24 時間の集計と異常判定
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          UNVERIFIED_ALERT: "10"
        run: python3 infra/check/contact_logs.py --hours 24 --check /tmp/check.json --report /tmp/report.txt
      - name: 異常があれば noc@ へ通知
        if: steps.check.outputs.alert == 'true'
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          NOC_EMAIL: ${{ vars.NOC_EMAIL }}
          TITLE: ${{ steps.check.outputs.title }}
        run: |
          node infra/check/notify_noc.mjs --subject "[REYZ noc] contact-watch: $TITLE" --body-file /tmp/report.txt
      - name: 異常は run も失敗にする（GitHub の通知にも載せる）
        if: steps.check.outputs.alert == 'true'
        run: exit 1
