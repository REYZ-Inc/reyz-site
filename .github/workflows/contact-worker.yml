# 問い合わせフォーム受付 Worker（workers/contact → Cloudflare Workers、reyz.inc/api/contact）と、フォーム側 JS の関門。設計: docs/contact-pipeline.md
#
# PR   : worker-tests（自己テスト + wrangler dry-run、認証不要）
#        stack-e2e（CI 内でサイト生成物 ＋ Worker を同一 origin で起動し、本物の Turnstile（公式テストキー）でフォーム UI を最後まで操作。
#                   Google は no-reply@ の OAuth でアクセストークン取得まで。メールは送らない。通らなければマージできない）
# main : deploy（deploy → GitHub Secrets を Worker secret へ宣言的に同期: 管理対象は値があれば設定・空なら削除、管理対象外の secret は削除
#                → 疎通。environment `cloudflare`。初回配備でも動く順序）→ 本番 e2e は contact-e2e.yml が引き継ぐ
name: contact-worker
on:
  pull_request:   # すべての PR で実行（ブランチ保護の必須チェック `worker-tests` / `stack-e2e` が「未報告」で止まらないよう、パス絞り込みはしない）
  push:
    branches: [main]
    paths: ['workers/contact/**', 'infra/oauth/**', 'qa/e2e_contact.js', '.github/workflows/contact-worker.yml']   # 関門が読むものはすべて含める（含めないと、失敗した main run の修正で配備が再開しない）
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contact-worker-${{ github.ref }}
  cancel-in-progress: false
env:
  WRANGLER_VERSION: "4.142.0"
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: workers/contact } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - name: self-test（ネットワーク不要）
        run: node --test
      - name: 同意処理の self-test（infra/oauth、ネットワーク不要）
        working-directory: ${{ github.workspace }}
        run: node --test infra/oauth/test/*.test.mjs
      - name: wrangler config / bundle check（dry-run、認証不要）
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --dry-run --outdir /tmp/wr-out
        env: { WRANGLER_SEND_METRICS: "false" }

  stack-e2e:
    # フォーク PR には secret が渡らないため実行しない（この repo は所有者のみ push 可）
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: サイト生成物をコピーし、CI 用 wrangler 設定を本番設定から生成
        run: |
          python3 build/build.py >/dev/null
          rm -rf /tmp/ci-site && cp -r site /tmp/ci-site
          python3 workers/contact/ci/make_ci_config.py --site /tmp/ci-site --origin http://127.0.0.1:8787 --out /tmp/wrangler.ci.jsonc
      - name: Worker を起動（秘密は .dev.vars に一時展開。ログには出さない）
        id: stack
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          IS_BOT: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          mkdir -p /tmp/ci-stack && cp /tmp/wrangler.ci.jsonc /tmp/ci-stack/wrangler.ci.jsonc
          # .dev.vars は設定ファイルと同じディレクトリに置く。
          # Dependabot の PR には repo の secret が渡らない（GitHub の仕様）。その場合だけ Google の部分を「任意」にし（ダミー値で Worker を起動、
          # pass ケースは Turnstile 照合と UI まで判定）、Google トークン取得は次の人の PR／main で判定する。人の PR で secret が無ければ従来どおり 503 で落ちる
          if [ "$IS_BOT" = "true" ] && [ -z "$GMAIL_OAUTH_REFRESH_TOKEN" ]; then
            GMAIL_OAUTH_CLIENT_ID=dependabot-no-secrets; GMAIL_OAUTH_CLIENT_SECRET=dependabot-no-secrets; GMAIL_OAUTH_REFRESH_TOKEN=dependabot-no-secrets
            echo "e2e_google=optional" >> "$GITHUB_OUTPUT"; echo "::notice title=stack-e2e::Dependabot の PR: secret が無いため Google トークン取得の判定は任意（Turnstile・UI・Worker の受付は判定する）"
          else
            echo "e2e_google=required" >> "$GITHUB_OUTPUT"
          fi
          {
            for k in GMAIL_OAUTH_CLIENT_ID GMAIL_OAUTH_CLIENT_SECRET GMAIL_OAUTH_REFRESH_TOKEN; do printf '%s=%s\n' "$k" "${!k}"; done
            printf 'TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA\n'
          } > /tmp/ci-stack/.dev.vars
          cd /tmp/ci-stack
          nohup npx --yes wrangler@${WRANGLER_VERSION} dev --config wrangler.ci.jsonc --port 8787 --ip 127.0.0.1 --log-level warn > /tmp/wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do sleep 1; curl -s -o /dev/null http://127.0.0.1:8787/api/contact && break; done
          curl -s -o /dev/null -w 'GET /api/contact -> %{http_code}\n' http://127.0.0.1:8787/api/contact
      - name: e2e — pass（合格 → 受付・Google アクセストークン取得）
        env: { E2E_GOOGLE: "${{ steps.stack.outputs.e2e_google }}" }
        run: node qa/e2e_contact.js --mode ci --base http://127.0.0.1:8787 --case pass
      - name: e2e — fail-widget（ウィジェット失敗 → fail-open で未検証受付）
        run: node qa/e2e_contact.js --mode ci --base http://127.0.0.1:8787 --case fail-widget
      - name: e2e — interactive（対話式 → 送信ボタンが完了を待つ）
        run: node qa/e2e_contact.js --mode ci --base http://127.0.0.1:8787 --case interactive
      - name: Worker を「常に不合格」の秘密キーで再起動
        env: { WRANGLER_SEND_METRICS: "false" }
        run: |
          pkill -f 'wrangler dev' || true; sleep 2
          cd /tmp/ci-stack && sed -i 's/^TURNSTILE_SECRET_KEY=.*/TURNSTILE_SECRET_KEY=2x0000000000000000000000000000000AA/' .dev.vars
          nohup npx --yes wrangler@${WRANGLER_VERSION} dev --config wrangler.ci.jsonc --port 8787 --ip 127.0.0.1 --log-level warn > /tmp/wrangler-dev2.log 2>&1 &
          for i in $(seq 1 60); do sleep 1; curl -s -o /dev/null http://127.0.0.1:8787/api/contact && break; done
      - name: e2e — fail-secret（照合不合格 → 未検証で受付、codes に理由）
        run: node qa/e2e_contact.js --mode ci --base http://127.0.0.1:8787 --case fail-secret
      - name: 後始末（秘密の一時ファイルを削除）
        if: always()
        run: pkill -f 'wrangler dev' || true; rm -f /tmp/ci-stack/.dev.vars
      - name: keep screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: contact-stack-e2e, path: qa/out/e2e_contact_ci_*.png, retention-days: 7, if-no-files-found: ignore }

  deploy:
    if: github.event_name != 'pull_request'
    needs: [worker-tests, stack-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - name: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/contact
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Worker の secret を GitHub Secrets と宣言的に同期（管理対象は値があれば設定・空なら削除。管理対象外＝Worker にだけある secret は削除）
        working-directory: workers/contact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          # Worker 側の現状は `wrangler secret list --format json`（[{name,type}] の配列。前後に他の出力が混じっても配列だけ取り出す）
          npx --yes wrangler@${WRANGLER_VERSION} secret list --format json > /tmp/current.raw
          python3 -c "import json,sys; t=open('/tmp/current.raw').read(); i=t.find('['); j=t.rfind(']'); json.dump(json.loads(t[i:j+1]) if i >= 0 else [], sys.stdout)" > /tmp/current.json
          jq -n --slurpfile cur /tmp/current.json '
            ["GMAIL_OAUTH_CLIENT_ID","GMAIL_OAUTH_CLIENT_SECRET","GMAIL_OAUTH_REFRESH_TOKEN","TURNSTILE_SECRET_KEY"] as $k
            | [$ENV.GMAIL_OAUTH_CLIENT_ID, $ENV.GMAIL_OAUTH_CLIENT_SECRET, $ENV.GMAIL_OAUTH_REFRESH_TOKEN, $ENV.TURNSTILE_SECRET_KEY] as $v
            | ([range($k|length)] | map({key: $k[.], value: (if ($v[.] // "") == "" then null else $v[.] end)}))
              + ([$cur[0][]?.name] | map(select(. as $n | $k | index($n) | not)) | map({key: ., value: null}))
            | from_entries' > /tmp/secrets.json
          echo "secrets to set:    $(jq -r 'to_entries | map(select(.value != null) | .key) | join(",")' /tmp/secrets.json)"
          echo "secrets to delete: $(jq -r 'to_entries | map(select(.value == null) | .key) | join(",")' /tmp/secrets.json)"
          echo "::notice title=contact-worker secrets::set=$(jq -r 'to_entries | map(select(.value != null) | .key) | join(",")' /tmp/secrets.json) delete=$(jq -r 'to_entries | map(select(.value == null) | .key) | join(",")' /tmp/secrets.json)"
          npx --yes wrangler@${WRANGLER_VERSION} secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json /tmp/current.json /tmp/current.raw
      - name: 配備後の疎通（GET は 405 = Worker が reyz.inc/api/contact で応答している。ルート反映まで最大 2 分待つ）
        run: |
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' https://reyz.inc/api/contact || echo 000)
            echo "try $i: GET https://reyz.inc/api/contact -> $code"
            [ "$code" = "405" ] && break
            sleep 10
          done
          echo "::notice title=contact-worker deploy::GET https://reyz.inc/api/contact -> HTTP $code after $i tries (expected 405)"
          test "$code" = "405"
