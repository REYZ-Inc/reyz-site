# main への push = 検証 → GitHub Pages へ自動配備（reyz.inc）。Pull Request は検証のみ。
# infra/（DNS 等）や workers/（API）だけの変更ではサイトを再配備しない。
name: verify-and-deploy
on:
  push:
    branches: [main]
    paths-ignore: ['infra/**', 'workers/**', 'docs/**', '.github/workflows/cloudflare-dns.yml', '.github/workflows/contact-worker.yml', '.github/workflows/contact-logs.yml', '.github/workflows/contact-e2e.yml', '.github/workflows/contact-watch.yml', '.github/workflows/docs-gate.yml', '.github/PULL_REQUEST_TEMPLATE.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  site-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: verify (build reproducibility, validators, browser checks)
        run: bash qa/run_all.sh
      - name: keep screenshots and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: qa-report, path: qa/out, retention-days: 14 }
      - name: enable GitHub Pages (Actions source) if not yet enabled  # 権限が無い場合は失敗扱いにしない（設定画面で有効化）
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with: { enablement: true }
      - name: pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: site }
  deploy:
    if: github.event_name != 'pull_request'
    needs: site-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
