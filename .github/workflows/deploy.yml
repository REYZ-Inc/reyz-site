# main への push = 検証 → GitHub Pages へ自動配備（reyz.inc）。Pull Request は検証のみ。
# infra/（DNS 等）や workers/（API）だけの変更ではサイトを再配備しない。
name: verify-and-deploy
on:
  push:
    branches: [main]
    paths-ignore: ['infra/**', 'workers/**', 'docs/**', '.github/workflows/cloudflare-dns.yml', '.github/workflows/contact-worker.yml', '.github/workflows/contact-logs.yml', '.github/workflows/contact-e2e.yml', '.github/workflows/contact-watch.yml', '.github/workflows/docs-gate.yml', '.github/PULL_REQUEST_TEMPLATE.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  site-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: verify (build reproducibility, validators, browser checks)
        run: bash qa/run_all.sh
      - name: keep screenshots and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: qa-report, path: qa/out, retention-days: 14 }
      - name: enable GitHub Pages (Actions source) if not yet enabled  # 権限が無い場合は失敗扱いにしない（設定画面で有効化）
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with: { enablement: true }
      - name: pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with: { path: site }
  deploy:
    if: github.event_name != 'pull_request'
    needs: site-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
