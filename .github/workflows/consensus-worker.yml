# REYZ CONSENSUS 入口 Worker（workers/consensus → Cloudflare Workers、reyz.inc/api/consensus/*）の関門。設計: docs/consensus-entry.md
#
# PR   : consensus-tests（自己テスト + wrangler dry-run、認証不要）
#        consensus-stack（CI 内で Worker を起動し、health → ready / turn の dry_run（モデルは呼ばない）/ 他 origin の拒否 を実機で確認）
# main : deploy（deploy → GitHub Secrets の ANTHROPIC_API_KEY を Worker secret へ宣言的に同期 → 疎通: health が 200）。environment `cloudflare`
#        サイト側（site/assets/site.js）は health の ready=false なら入口を出さない。秘密が未設定でも本番は壊れない（Fail-Closed）
name: consensus-worker
on:
  pull_request:
  push:
    branches: [main]
    paths: ['workers/consensus/**', '.github/workflows/consensus-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: consensus-worker-${{ github.ref }}
  cancel-in-progress: false
env:
  WRANGLER_VERSION: "4.142.0"
jobs:
  consensus-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: workers/consensus } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: self-test（ネットワーク不要。モデル API は差し替え）
        run: node --test
      - name: wrangler config / bundle check（dry-run、認証不要）
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --dry-run --outdir /tmp/wr-out
        env: { WRANGLER_SEND_METRICS: "false" }

  consensus-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Worker を起動（鍵はダミー。モデルは呼ばない。ログには出さない）
        working-directory: workers/consensus
        env: { WRANGLER_SEND_METRICS: "false" }
        run: |
          printf 'ANTHROPIC_API_KEY=ci-dummy-not-a-key\n' > .dev.vars
          nohup npx --yes wrangler@${WRANGLER_VERSION} dev --port 8788 --ip 127.0.0.1 --log-level warn > /tmp/wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do sleep 1; curl -s -o /dev/null http://127.0.0.1:8788/api/consensus/health && break; done
      - name: health → ready / dry_run → 200 / 他 origin → 403 / 上限 → 409
        run: |
          set -euo pipefail
          B=http://127.0.0.1:8788/api/consensus
          h=$(curl -sS "$B/health"); echo "health: $h"; echo "$h" | grep -q '"ready":true'
          body='{"who":"creator","map":{"goal":"a。","place":"b。","step":"c。"},"messages":[{"role":"user","content":"x"}],"chain":"","dry_run":true}'
          code=$(curl -sS -o /tmp/r1.json -w '%{http_code}' -H 'Origin: https://reyz.inc' -H 'Content-Type: application/json' -d "$body" "$B/turn"); echo "dry_run: $code $(cat /tmp/r1.json)"; test "$code" = "200"; grep -q '"dry_run":true' /tmp/r1.json
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Origin: https://evil.example' -H 'Content-Type: application/json' -d "$body" "$B/turn"); echo "other origin: $code"; test "$code" = "403"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$B/turn"); echo "GET turn: $code"; test "$code" = "405"
          m='[{"role":"user","content":"u"}'; for i in $(seq 1 10); do m="$m,{\"role\":\"assistant\",\"content\":\"a\"},{\"role\":\"user\",\"content\":\"u\"}"; done; m="$m]"
          code=$(curl -sS -o /tmp/r2.json -w '%{http_code}' -H 'Origin: https://reyz.inc' -H 'Content-Type: application/json' -d "{\"who\":\"creator\",\"map\":{\"goal\":\"a。\",\"place\":\"b。\",\"step\":\"c。\"},\"messages\":$m,\"chain\":\"\"}" "$B/turn"); echo "turn_limit: $code $(cat /tmp/r2.json)"; test "$code" = "409"
      - name: 後始末
        if: always()
        run: pkill -f 'wrangler dev' || true; rm -f workers/consensus/.dev.vars

  deploy:
    if: github.event_name != 'pull_request'
    needs: [consensus-tests, consensus-stack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/consensus
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Worker の secret を GitHub Secrets と宣言的に同期（ANTHROPIC_API_KEY。値があれば設定・空なら削除。管理対象外＝Worker にだけある secret は削除）
        working-directory: workers/consensus
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --yes wrangler@${WRANGLER_VERSION} secret list --format json > /tmp/current.raw
          python3 -c "import json,sys; t=open('/tmp/current.raw').read(); i=t.find('['); j=t.rfind(']'); json.dump(json.loads(t[i:j+1]) if i >= 0 else [], sys.stdout)" > /tmp/current.json
          jq -n --slurpfile cur /tmp/current.json '
            ["ANTHROPIC_API_KEY"] as $k
            | [$ENV.ANTHROPIC_API_KEY] as $v
            | ([range($k|length)] | map({key: $k[.], value: (if ($v[.] // "") == "" then null else $v[.] end)}))
              + ([$cur[0][]?.name] | map(select(. as $n | $k | index($n) | not)) | map({key: ., value: null}))
            | from_entries' > /tmp/secrets.json
          echo "::notice title=consensus-worker secrets::set=$(jq -r 'to_entries | map(select(.value != null) | .key) | join(",")' /tmp/secrets.json) delete=$(jq -r 'to_entries | map(select(.value == null) | .key) | join(",")' /tmp/secrets.json)"
          npx --yes wrangler@${WRANGLER_VERSION} secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json /tmp/current.json /tmp/current.raw
      - name: 配備後の疎通（health が 200。ready=false なら秘密が未設定＝サイトは入口を出さない）
        run: |
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/h.json -w '%{http_code}' https://reyz.inc/api/consensus/health || echo 000)
            echo "try $i: GET https://reyz.inc/api/consensus/health -> $code $(cat /tmp/h.json 2>/dev/null)"
            [ "$code" = "200" ] && break
            sleep 10
          done
          test "$code" = "200"
          if grep -q '"ready":true' /tmp/h.json; then echo "::notice title=consensus-worker deploy::ready=true（入口は表示される）"; else echo "::warning title=consensus-worker deploy::ready=false（GitHub Secrets の ANTHROPIC_API_KEY が未設定。入口は表示されない）"; fi
